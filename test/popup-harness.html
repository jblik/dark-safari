<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Popup harness</title>
  <link rel="stylesheet" href="../extension/popup/popup.css">
</head>
<body>
  <script src="stub-api.js"></script>
  <script>
    // Loads the real popup markup + scripts against the stubbed API.
    (async () => {
      const html = await (await fetch("../extension/popup/popup.html")).text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      doc.querySelectorAll("script").forEach((s) => s.remove());
      document.body.insertAdjacentHTML("afterbegin", doc.body.innerHTML);
      for (const src of [
        "../extension/shared/browser.js",
        "../extension/shared/settings.js",
        "../extension/popup/popup.js"
      ]) {
        await new Promise((resolve) => {
          const el = document.createElement("script");
          el.src = src;
          el.onload = resolve;
          document.body.appendChild(el);
        });
      }
    })();
  </script>
</body>
</html>
