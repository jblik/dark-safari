<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dark Safari harness</title>
  <link rel="stylesheet" href="../extension/content/dark.css">
  <style>
    body { font: 16px/1.5 system-ui; margin: 0; padding: 24px; background: #fff; color: #222; }
    .card { background: #f4f4f4; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 12px 0; }
    #controls { position: fixed; right: 16px; top: 16px; background: #eee; padding: 10px; border-radius: 8px; font-size: 13px; }
    #controls button { display: block; width: 100%; margin: 3px 0; }
    .bg-photo { width: 240px; height: 120px; background-image: url('photo.svg'); background-size: cover; }
  </style>
</head>
<body>
  <h1>Dark Safari test page</h1>
  <p>This light-themed page should turn dark when the extension core runs.</p>
  <div class="card">
    <h2>A card component</h2>
    <p>Some text on a light gray card with a <a href="#">blue link</a>.</p>
  </div>
  <h2>Media (should keep natural colors)</h2>
  <img id="photo" src="photo.svg" width="240" height="120" alt="test photo">
  <div class="bg-photo"></div>

  <div id="controls">
    <strong>Harness controls</strong>
    <button onclick="DS.setGlobal({enabled:false})">Disable</button>
    <button onclick="DS.setGlobal({enabled:true})">Enable</button>
    <button onclick="DS.setGlobal({brightness:70})">Brightness 70</button>
    <button onclick="DS.setGlobal({sepia:60})">Warmth 60</button>
    <button onclick="DS.setGlobal({grayscale:true})">Grayscale on</button>
    <button onclick="DS.setGlobal({...DS.DEFAULTS})">Reset</button>
  </div>

  <script src="stub-api.js"></script>
  <script src="../extension/shared/browser.js"></script>
  <script src="../extension/shared/settings.js"></script>
  <script src="../extension/content/dark.js"></script>
</body>
</html>
